about_story:
  - >
    I currently work as an AI engineer building retail automation systems for
    Target India via eTeam India. A lot of that work is not about chasing a
    single framework. It is about choosing workable architectures, comparing
    them carefully, and making them observable enough to trust when the problem
    is messy and the constraints are real.
  - >
    Before moving fully into AI engineering, I spent years in theoretical
    physics working on asymptotic symmetries, holography, Carrollian and
    celestial conformal field theories, and related questions. That background
    still shapes my working style far more than any single tool does.
  - >
    Physics taught me to take ideas apart slowly, to care about definitions, to
    be suspicious of claims that sound complete too quickly, and to treat
    failure modes as part of understanding rather than as an inconvenience.
    That mindset carries directly into how I build and evaluate AI systems.
  - >
    I remain interested in active AI research, especially where reasoning
    systems meet scientific or mathematical problems. From time to time I still
    work on research questions, and I want this site to leave room for both the
    engineer I am now and the researcher I still feel connected to.

