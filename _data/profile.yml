research_intro: >
  My research background is in theoretical physics, but I am also interested in
  active AI research, especially when it touches reasoning, scientific
  workflows, and mathematically structured problems. This page holds the
  academic side of that story.

physics_research_summary: >
  In physics, my work has focused on asymptotic symmetries, holography,
  W-algebras, Carrollian and celestial conformal field theories, and nearby
  questions around boundary limits and structure in gravity and field theory. I
  still think of this body of work as a live part of my intellectual
  background, not just a previous chapter.

research_interests:
  - Asymptotic symmetries of flat, AdS, and conformal gravity.
  - W-algebras, Carrollian conformal field theories, and celestial CFTs.
  - Near-boundary limits of string theory and twistor string theory on AdS.
  - Automated reasoning and AI for theoretical physics and mathematical problems.

